name: CWAC Scan

on:
  workflow_dispatch:
  push:
    branches:
      - development

jobs:
  cwac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Firefox + geckodriver
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox geckodriver
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          npm install
      - name: Run CWAC
        run: |
          source .venv/bin/activate
          python cwac.py config_qld_simple_ci.json
