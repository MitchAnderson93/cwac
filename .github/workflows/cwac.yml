name: CWAC Scan

on:
  workflow_dispatch:
  push:
    branches:
      - development

jobs:
  cwac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox
      - name: Install geckodriver
        run: |
          GECKO_VERSION=0.34.0
          curl -L -o /tmp/geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/v${GECKO_VERSION}/geckodriver-v${GECKO_VERSION}-linux64.tar.gz"
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          sudo mv /tmp/geckodriver /usr/local/bin/geckodriver
          sudo chmod +x /usr/local/bin/geckodriver
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          npm install
      - name: Run CWAC
        run: |
          source .venv/bin/activate
          python cwac.py config_qld_simple_ci.json
